server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the core service. Inside the compose network,
    # `core` resolves to the core container on its native 8080 — the same
    # role Vite's dev proxy plays at npm-run-dev time.
    location /api/ {
        proxy_pass http://core:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Don't buffer responses — useful when the core ever starts
        # streaming (e.g. an SSE incident feed).
        proxy_buffering off;
    }

    # SPA fallback: anything that isn't a real file falls back to index.html
    # so client-side routes like /agents resolve in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed Vite assets aggressively; index.html should never be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
