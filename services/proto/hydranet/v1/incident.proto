syntax = "proto3";

package hydranet.v1;

option go_package = "github.com/sathwikshetty33/hydranet/services/proto/hydranet/v1;hydranetv1";

// IncidentService is the agent-to-core wire protocol. Agents identify
// themselves via gRPC metadata:
//   authorization: Bearer <token>
//   x-agent-id:    <numeric agent id>
service IncidentService {
  // ReportIncident records a single observed incident.
  rpc ReportIncident(IncidentReport) returns (IncidentAck);
}

message IncidentReport {
  string pod_name = 1;
  string service_name = 2;
  string message = 3;
  string severity = 4;
  string namespace = 5;
}

message IncidentAck {
  uint64 incident_id = 1;
  // quarantine instructs the agent to apply a NetworkPolicy-based
  // isolation on the reported pod. The decision is made by the core
  // based on this incident's severity plus the pod's recent history.
  bool quarantine = 2;
}
